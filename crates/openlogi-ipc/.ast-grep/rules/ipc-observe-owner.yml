# Owner: openlogi_ipc::client::Observer — the observe loop's connection state:
# the client, the generation ledger, and the one observe call in flight, armed
# again after every answer. Only the IPC clients are in scope: the agent side
# serves these calls.
id: ipc-observe-owner
language: rust
severity: error
message: Observing the agent is openlogi_ipc::client::Observer's job (Observer::state, Observer::action_ring, Observer::backlight, Observer::backlight_effect, Observer::notices, Observer::lock_keys, Observer::ui_chrome, Observer::charging, Observer::connection, Observer::wheel_mode or Observer::dpi, then next()). Do not call observe or any observe_* indicator method on the client here.
note: |
  The settings app and the overlay each kept their own client, ledger and
  call-in-flight bundle around these calls. See "Single source of truth"
  in AGENTS.md.
files:
  - crates/openlogi-desktop/**/*.rs
  - crates/openlogi-overlay/**/*.rs
  - crates/openlogi-cli/**/*.rs
rule:
  any:
    - pattern: $CLIENT.observe_action_ring($$$ARGS)
    - pattern: $CLIENT.observe_backlight($$$ARGS)
    - pattern: $CLIENT.observe_backlight_effect($$$ARGS)
    - pattern: $CLIENT.observe_notices($$$ARGS)
    - pattern: $CLIENT.observe_lock_keys($$$ARGS)
    - pattern: $CLIENT.observe_ui_chrome($$$ARGS)
    - pattern: $CLIENT.observe_charging($$$ARGS)
    - pattern: $CLIENT.observe_connection($$$ARGS)
    - pattern: $CLIENT.observe_wheel_mode($$$ARGS)
    - pattern: $CLIENT.observe_dpi($$$ARGS)
    # tarpc's observe takes a request context first; GPUI's `cx.observe` takes
    # an entity and a closure, and is not this.
    - all:
        - pattern: $CLIENT.observe($CTX, $SINCE)
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: '(?i)context|ctx'
